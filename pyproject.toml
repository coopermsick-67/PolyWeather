[project]
name = "polyweather"
version = "0.1.0"
description = "Leakage-aware daily Tmax forecasting for KNYC, KMIA, KMDW, KLAX, and KSFO."
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]

[project.optional-dependencies]
server = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "gunicorn>=22.0",
]

[project.scripts]
polyweather = "polyweather.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
